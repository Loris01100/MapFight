<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapFight</title>
</head>
<body>
  <main>
    <div id="arena">
      <svg id="map"></svg>
      <div id="dice" hidden></div>
    </div>
    <section id="stats">
      <div id="left"><b id="alive"></b><span>PAYS RESTANTS</span></div>
      <div id="topcard">
        <header><h2>TOP 5 PAYS</h2><small>TERRITOIRES</small></header>
        <ol id="top"></ol>
      </div>
    </section>
    <button id="next">Tour suivant</button>
    <p id="status"></p>
    <details>
      <summary id="all-title">Liste complète</summary>
      <ol id="all"></ol>
    </details>
    <details>
      <summary>Historique</summary>
      <ol id="history" reversed></ol>
    </details>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
